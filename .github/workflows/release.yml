name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/reprapfirmware/manifest.json

permissions:
  contents: write

jobs:
  release:
    name: Publish HACS release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/reprapfirmware/manifest.json")
              .read_text(encoding="utf-8")
          )

          print(manifest["version"])
          PY
          )"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify version is not already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --title "$TAG"