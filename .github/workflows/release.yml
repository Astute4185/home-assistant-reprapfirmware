name: Publish release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    name: Publish HACS release
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/version-bump'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/reprapfirmware/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          print(manifest["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target main \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
