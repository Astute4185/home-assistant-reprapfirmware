name: Automatic patch version

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  bump:
    name: Create patch version PR
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install \
            -r requirements-test.txt \
            -r requirements-runtime.txt

      - name: Increment patch version
        id: version
        run: |
          version="$(python scripts/bump_patch.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run repository checks against bumped version
        run: scripts/check

      - name: Create version bump pull request
        id: bump-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/version-bump
          delete-branch: true
          commit-message: "chore: bump version to ${{ steps.version.outputs.version }}"
          title: "chore: bump version to ${{ steps.version.outputs.version }}"
          body: |
            Automated patch-version increment after a successfully merged Dependabot update.

            The PR must pass the normal repository, Hassfest, and HACS validation gates before merge.
          labels: |
            dependencies
            automated
          add-paths: |
            custom_components/reprapfirmware/manifest.json

      - name: Enable auto-merge for version bump PR
        if: steps.bump-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge \
            --auto \
            --squash \
            "${{ steps.bump-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}