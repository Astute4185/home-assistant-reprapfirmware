name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate integration version policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          echo "$changed_files"

          manifest_path="custom_components/reprapfirmware/manifest.json"

          manifest_changed=false
          integration_changed=false

          while IFS= read -r file; do
            case "$file" in
              "$manifest_path")
                manifest_changed=true
                ;;
              custom_components/reprapfirmware/*)
                integration_changed=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$integration_changed" = true ] && [ "$manifest_changed" = false ]; then
            echo "::error::Shipped integration files changed but manifest.json was not bumped."
            exit 1
          fi

          if [ "$manifest_changed" = false ]; then
            echo "No manifest change required."
            exit 0
          fi

          base_version="$(
            git show "$BASE_SHA:$manifest_path" |
            python -c 'import json,sys; print(json.load(sys.stdin)["version"])'
          )"

          head_version="$(
            python -c '
          import json
          from pathlib import Path

          path = Path("custom_components/reprapfirmware/manifest.json")
          print(json.loads(path.read_text(encoding="utf-8"))["version"])
          '
          )"

          echo "Base version: $base_version"
          echo "PR version:   $head_version"

          python - "$base_version" "$head_version" <<'PY'
          import re
          import sys

          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$"
          )

          old_text, new_text = sys.argv[1], sys.argv[2]

          old_match = semver.fullmatch(old_text)
          new_match = semver.fullmatch(new_text)

          if old_match is None:
              raise SystemExit(
                  f"::error::Base manifest version is not valid SemVer: {old_text}"
              )

          if new_match is None:
              raise SystemExit(
                  f"::error::PR manifest version is not valid SemVer: {new_text}"
              )

          old = tuple(map(int, old_match.groups()))
          new = tuple(map(int, new_match.groups()))

          if new <= old:
              raise SystemExit(
                  f"::error::Manifest version must increase: "
                  f"{old_text} -> {new_text}"
              )

          print(f"Manifest version increased: {old_text} -> {new_text}")
          PY

  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install             -r requirements-test.txt             -r requirements-runtime.txt

      - name: Run repository checks
        run: scripts/check

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest

    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
